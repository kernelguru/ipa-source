services:
  ipa-source:
    build: .
    # oder fertiges Image aus GitHub Actions:
    # image: ghcr.io/kernelguru/ipa-source:latest
    container_name: ipa-source
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    # Pairing-Dateien per WLAN (iPhone per mDNS finden): stattdessen Host-Netz verwenden
    # und "ports:" weglassen. Der Server lauscht dann direkt auf LISTEN_PORT des Hosts
    # (Standard 8080 – ist der belegt, z. B. LISTEN_PORT=8081 setzen):
    # network_mode: host
    environment:
      BASE_URL: ${BASE_URL:-}            # z. B. https://apps.example.lan
      ADMIN_USER: ${ADMIN_USER:-}        # optional: Admin beim ersten Start anlegen
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-0} # 1 hinter HTTPS
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-0}      # 0 = unbegrenzt (nur freier Speicher zählt)
      UPLOAD_CHUNK_MB: ${UPLOAD_CHUNK_MB:-32} # Teilgröße beim Upload über die Weboberfläche
      # USB über Windows (Docker in Hyper-V-VM): Apple Mobile Device Service per TCP, siehe README
      USBMUXD_SOCKET_ADDRESS: ${USBMUXD_SOCKET_ADDRESS:-}
      LISTEN_PORT: ${LISTEN_PORT:-8080}  # Port im Container (bei network_mode: host = Port auf dem Host)
    volumes:
      - ./data:/data
      # USB-Installation (optional): usbmuxd auf dem Host installieren
      # (apt install usbmuxd), iPhone per USB anschließen, dann diese Zeile aktivieren:
      # - /var/run/usbmuxd:/var/run/usbmuxd
