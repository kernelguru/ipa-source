services:
  ipa-source:
    build: .
    # oder fertiges Image aus GitHub Actions:
    # image: ghcr.io/kernelguru/ipa-source:latest
    container_name: ipa-source
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      BASE_URL: ${BASE_URL:-}            # z. B. https://apps.example.lan
      ADMIN_USER: ${ADMIN_USER:-}        # optional: Admin beim ersten Start anlegen
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-0} # 1 hinter HTTPS
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2048}
    volumes:
      - ./data:/data
